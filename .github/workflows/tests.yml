name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The classifier and geometry tests are pure Python; MediaPipe is not needed.
      - run: pip install pytest
      - run: python -m pytest -q
